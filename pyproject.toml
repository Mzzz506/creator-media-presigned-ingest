[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "creator-media-presigned-ingest"
version = "0.1.0"
description = "FastAPI example for presigned creator media uploads and processing handoff."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.2,<9", "pytest-asyncio>=0.23,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/media_ingest"]
